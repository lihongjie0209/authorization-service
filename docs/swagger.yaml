basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      commit:
        type: string
      started_at:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Dependency:
    properties:
      latency:
        type: string
      status:
        type: string
    type: object
  health.Status:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/health.Dependency'
        type: object
      status:
        type: string
    type: object
  httptransport.BatchCheckAuthorizationRequest:
    properties:
      checks:
        items:
          $ref: '#/definitions/httptransport.CheckAuthorizationRequest'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - checks
    type: object
  httptransport.BindingBody:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      organization_unit_id:
        type: string
      role_id:
        type: string
      status:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.BindingPageResponseBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.BindingBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.CheckAuthorizationRequest:
    properties:
      action:
        type: string
      attributes:
        additionalProperties:
          type: string
        type: object
      resource_id:
        type: string
      resource_type:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
    required:
    - action
    - resource_type
    - subject_id
    - subject_type
    - tenant_id
    type: object
  httptransport.CheckMyPermissionCodesRequest:
    properties:
      permission_codes:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      tenant_id:
        type: string
    required:
    - permission_codes
    - tenant_id
    type: object
  httptransport.CreateBindingRequest:
    properties:
      organization_unit_id:
        type: string
      role_id:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
    required:
    - role_id
    - subject_id
    - subject_type
    - tenant_id
    type: object
  httptransport.CreateMyBindingRequest:
    properties:
      organization_unit_id:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      role_id:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - role_id
    - subject_id
    - subject_type
    - tenant_id
    type: object
  httptransport.CreateMyPermissionRequest:
    properties:
      action:
        type: string
      code:
        type: string
      condition_expression:
        type: string
      name:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      resource_type:
        type: string
      tenant_id:
        type: string
    required:
    - action
    - code
    - name
    - permission_scope
    - resource_type
    - tenant_id
    type: object
  httptransport.CreateMyRoleRequest:
    properties:
      code:
        type: string
      data_scope:
        type: string
      description:
        type: string
      name:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      tenant_id:
        type: string
    required:
    - code
    - data_scope
    - name
    - permission_scope
    - tenant_id
    type: object
  httptransport.CreatePermissionRequest:
    properties:
      action:
        type: string
      code:
        type: string
      condition_expression:
        type: string
      name:
        type: string
      resource_type:
        type: string
      tenant_id:
        type: string
    required:
    - action
    - code
    - name
    - resource_type
    - tenant_id
    type: object
  httptransport.CreateRoleRequest:
    properties:
      code:
        type: string
      data_scope:
        type: string
      description:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    required:
    - code
    - data_scope
    - name
    - tenant_id
    type: object
  httptransport.DecisionBody:
    properties:
      allowed:
        type: boolean
      data_scope:
        type: string
      decision_id:
        type: string
      organization_unit_ids:
        items:
          type: string
        type: array
      policy_version:
        type: integer
      reason:
        type: string
    type: object
  httptransport.DecisionsBody:
    properties:
      decisions:
        items:
          $ref: '#/definitions/httptransport.DecisionBody'
        type: array
    type: object
  httptransport.GrantMyRolePermissionRequest:
    properties:
      permission_id:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    required:
    - permission_id
    - permission_scope
    - role_id
    - tenant_id
    type: object
  httptransport.GrantRolePermissionRequest:
    properties:
      permission_id:
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    required:
    - permission_id
    - role_id
    - tenant_id
    type: object
  httptransport.ListBindingsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListMyBindingsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - tenant_id
    type: object
  httptransport.ListMyPermissionCatalogRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      search:
        maxLength: 100
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - tenant_id
    type: object
  httptransport.ListMyPermissionsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - tenant_id
    type: object
  httptransport.ListMyRolePermissionsRequest:
    properties:
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - role_id
    - tenant_id
    type: object
  httptransport.ListMyRolesRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      tenant_id:
        type: string
    required:
    - permission_scope
    - tenant_id
    type: object
  httptransport.ListPermissionsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListRolePermissionsRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  httptransport.ListRolesRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.MeResponseBody:
    properties:
      subject:
        type: string
    type: object
  httptransport.PermissionBody:
    properties:
      action:
        type: string
      code:
        type: string
      condition_expression:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      resource_type:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.PermissionCodeDecisionBody:
    properties:
      allowed_codes:
        items:
          type: string
        type: array
      policy_version:
        type: integer
    type: object
  httptransport.PermissionPageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.PermissionBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.Response:
    properties:
      body: {}
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  httptransport.RevokeBindingRequest:
    properties:
      binding_id:
        type: string
      version:
        type: integer
    required:
    - binding_id
    - version
    type: object
  httptransport.RevokeMyBindingRequest:
    properties:
      binding_id:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    required:
    - binding_id
    - permission_scope
    - tenant_id
    - version
    type: object
  httptransport.RevokeMyRolePermissionRequest:
    properties:
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      role_permission_id:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    required:
    - permission_scope
    - role_permission_id
    - tenant_id
    - version
    type: object
  httptransport.RevokeRolePermissionRequest:
    properties:
      role_permission_id:
        type: string
      version:
        type: integer
    required:
    - role_permission_id
    - version
    type: object
  httptransport.RoleBody:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      data_scope:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.RolePageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.RoleBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.RolePermissionBody:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      permission_id:
        type: string
      role_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.RolePermissionsBody:
    properties:
      role_permissions:
        items:
          $ref: '#/definitions/httptransport.RolePermissionBody'
        type: array
    type: object
  httptransport.UpdateMyPermissionRequest:
    properties:
      condition_expression:
        type: string
      name:
        type: string
      permission_id:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      status:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    required:
    - name
    - permission_id
    - permission_scope
    - status
    - tenant_id
    - version
    type: object
  httptransport.UpdateMyRoleRequest:
    properties:
      data_scope:
        type: string
      description:
        type: string
      name:
        type: string
      permission_scope:
        enum:
        - tenant
        - platform
        type: string
      role_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    required:
    - data_scope
    - name
    - permission_scope
    - role_id
    - status
    - tenant_id
    - version
    type: object
  httptransport.UpdatePermissionRequest:
    properties:
      condition_expression:
        type: string
      name:
        type: string
      permission_id:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - name
    - permission_id
    - status
    - version
    type: object
  httptransport.UpdateRoleRequest:
    properties:
      data_scope:
        type: string
      description:
        type: string
      name:
        type: string
      role_id:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - data_scope
    - name
    - role_id
    - status
    - version
    type: object
info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Application error codes:
    0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Go API Template
  version: "1.0"
paths:
  /api/v1/authorization/batch-check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Authorization checks
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.BatchCheckAuthorizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.DecisionsBody'
              type: object
      security:
      - Bearer: []
      summary: Preview up to 100 authorization decisions
      tags:
      - authorization-decisions
  /api/v1/authorization/bindings/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Role binding
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateBindingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingBody'
              type: object
      security:
      - Bearer: []
      summary: Bind a role to a membership, group, or service account
      tags:
      - authorization-bindings
  /api/v1/authorization/bindings/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant, optional subject, and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListBindingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingPageResponseBody'
              type: object
      security:
      - Bearer: []
      summary: List tenant or subject role bindings
      tags:
      - authorization-bindings
  /api/v1/authorization/bindings/revoke:
    post:
      consumes:
      - application/json
      parameters:
      - description: Binding and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RevokeBindingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingBody'
              type: object
      security:
      - Bearer: []
      summary: Revoke a binding with optimistic locking
      tags:
      - authorization-bindings
  /api/v1/authorization/check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Authorization check
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CheckAuthorizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.DecisionBody'
              type: object
      security:
      - Bearer: []
      summary: Preview an authorization decision
      tags:
      - authorization-decisions
  /api/v1/authorization/my-bindings/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped binding
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateMyBindingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingBody'
              type: object
      security:
      - Bearer: []
      summary: Bind a role in the current tenant or platform scope
      tags:
      - authorization-bindings
  /api/v1/authorization/my-bindings/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped binding pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListMyBindingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingPageResponseBody'
              type: object
      security:
      - Bearer: []
      summary: List bindings in the current tenant or platform scope
      tags:
      - authorization-bindings
  /api/v1/authorization/my-bindings/revoke:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped binding revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RevokeMyBindingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BindingBody'
              type: object
      security:
      - Bearer: []
      summary: Revoke a binding in the current tenant or platform scope
      tags:
      - authorization-bindings
  /api/v1/authorization/my-permission-catalog/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Selected tenant, permission scope, search and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListMyPermissionCatalogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PermissionPageBody'
              type: object
        "403":
          description: Permission catalog access denied
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Search permissions available to the authenticated tenant or platform
        administrator
      tags:
      - authorization-permissions
  /api/v1/authorization/my-permissions/check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant and permission codes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CheckMyPermissionCodesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PermissionCodeDecisionBody'
              type: object
      security:
      - Bearer: []
      summary: Check up to 100 scoped permission codes for the authenticated user
      tags:
      - authorization-decisions
  /api/v1/authorization/my-permissions/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateMyPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PermissionBody'
              type: object
      security:
      - Bearer: []
      summary: Create a permission in the authenticated user's tenant or platform
        scope
      tags:
      - authorization-permissions
  /api/v1/authorization/my-permissions/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped permission pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListMyPermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PermissionPageBody'
              type: object
      security:
      - Bearer: []
      summary: List permissions in the authenticated user's tenant or platform scope
      tags:
      - authorization-permissions
  /api/v1/authorization/my-permissions/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped permission update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateMyPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PermissionBody'
              type: object
      security:
      - Bearer: []
      summary: Update a permission in the authenticated user's tenant or platform
        scope
      tags:
      - authorization-permissions
  /api/v1/authorization/my-role-permissions/grant:
    post:
      consumes:
      - application/json
      parameters:
      - description: Scoped role permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GrantMyRolePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
