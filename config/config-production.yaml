# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: true
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: authorization
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/authorization/permissions/create
    - /api/v1/authorization/permissions/update
    - /api/v1/authorization/my-permissions/create
    - /api/v1/authorization/my-permissions/update
    - /api/v1/authorization/roles/create
    - /api/v1/authorization/roles/update
    - /api/v1/authorization/my-roles/create
    - /api/v1/authorization/my-roles/update
    - /api/v1/authorization/role-permissions/grant
    - /api/v1/authorization/role-permissions/revoke
    - /api/v1/authorization/my-role-permissions/grant
    - /api/v1/authorization/my-role-permissions/revoke
    - /api/v1/authorization/bindings/create
    - /api/v1/authorization/bindings/revoke
    - /api/v1/authorization/my-bindings/create
    - /api/v1/authorization/my-bindings/revoke
  grpc_methods:
    - /platform.authorization.v1.AuthorizationService/CreatePermission
    - /platform.authorization.v1.AuthorizationService/UpdatePermission
    - /platform.authorization.v1.AuthorizationService/CreateRole
    - /platform.authorization.v1.AuthorizationService/UpdateRole
    - /platform.authorization.v1.AuthorizationService/GrantRolePermission
    - /platform.authorization.v1.AuthorizationService/RevokeRolePermission
    - /platform.authorization.v1.AuthorizationService/CreateBinding
    - /platform.authorization.v1.AuthorizationService/RevokeBinding
    - /platform.authorization.v1.AuthorizationService/InvalidateSubject
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
